<!-- ============================================================ -->
<!-- BORDER                                                       -->
<!-- ============================================================ -->

<rect
    x="0.5"
    y="0.5"
    width="984"
    height="579"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.08"
    rx="12"/>


<!-- CORNERS -->

<path
    d="M8 42 V8 H42"
    fill="none"
    stroke="#F45C1C"
    stroke-width="1.2"
    stroke-linecap="square"/>


<path
    d="M943 8 H977 V42"
    fill="none"
    stroke="#F45C1C"
    stroke-width="1.2"
    stroke-linecap="square"/>


<path
    d="M8 538 V572 H42"
    fill="none"
    stroke="#F45C1C"
    stroke-width="1.2"
