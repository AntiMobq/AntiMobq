<tspan x="24" y="211">     -+**********+=:.    .:=+**********+-</tspan>
<tspan x="24" y="222">    :+**********+:          :+**********+:</tspan>
<tspan x="24" y="233">   :+**********+:     ..     :+**********+:</tspan>
<tspan x="24" y="244">  :+**********+:     :**:     :+**********+:</tspan>
<tspan x="24" y="255"> :+**********+:      +**+      :+**********+:</tspan>
<tspan x="24" y="266"> +**********+:       +**+       :+**********+</tspan>
<tspan x="24" y="277">+**********+:        :**:        :+**********+</tspan>
<tspan x="24" y="288">***********+:                     :+***********</tspan>
<tspan x="24" y="299">***********+:                     :+***********</tspan>
<tspan x="24" y="310">************+:                   :+************</tspan>
<tspan x="24" y="321">+***********+:                   :+***********+</tspan>
<tspan x="24" y="332"> +***********+:                 :+***********+</tspan>
<tspan x="24" y="343">  +***********+:               :+***********+</tspan>
<tspan x="24" y="354">   +***********+-             -+***********+</tspan>
<tspan x="24" y="365">    +************+-         -+************+</tspan>
<tspan x="24" y="376">     +*************+=======+*************+</tspan>
<tspan x="24" y="387">      -+******************************+-</tspan>
<tspan x="24" y="398">        -+**************************+-</tspan>
<tspan x="24" y="409">          :=+********************+=:</tspan>
<tspan x="24" y="420">             .:-=++++++++++=-:.</tspan>
<tspan x="24" y="431">                  .::::::::.</tspan>

        </text>


        <!-- LOGO BREATHING -->

        <animate
            attributeName="opacity"
            values="0.65;1;0.65"
            dur="4s"
            repeatCount="indefinite"/>

    </g>


    <!-- LOGO LABEL -->

    <text
        x="190"
        y="458"
        text-anchor="middle"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="12"
        fill="#F45C1C"
        opacity="0.65">

        ROBLOX STUDIO

    </text>


    <!-- ======================================================== -->
    <!-- DIVIDER                                                   -->
    <!-- ======================================================== -->

    <line
        x1="397"
        y1="22"
        x2="397"
        y2="558"
        stroke="#ffffff"
        stroke-opacity="0.12"
        stroke-width="1"/>


    <path
        d="M393 22 H401 M393 558 H401"
        fill="none"
        stroke="#F45C1C"
        stroke-width="1.2"/>


</g>


