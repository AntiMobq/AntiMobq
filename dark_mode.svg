<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    font-family="JetBrains Mono,Consolas,ui-monospace,monospace"
    width="985px"
    height="580px"
    font-size="16px"
    viewBox="0 0 985 580">

<style>
.key {
    fill: #F45C1C;
}

.value {
    fill: #f4f4f5;
}

.cc {
    fill: #8e8e96;
}

.ascii {
    font-size: 11px;
    font-family: "JetBrains Mono", Consolas, monospace;
}

text, tspan {
    white-space: pre;
}
</style>

<defs>

    <!-- CARD -->

    <clipPath id="card">
        <rect
            width="985"
            height="580"
            rx="12"/>
    </clipPath>


    <!-- GRID -->

    <pattern
        id="dots"
        width="56"
        height="56"
        patternUnits="userSpaceOnUse">

        <path
            d="M0 28h56M28 0v56"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.05"
            stroke-width="0.5"/>

        <circle
            cx="28"
            cy="28"
            r="1.15"
            fill="#F45C1C"
            fill-opacity="0.45"/>

    </pattern>


    <!-- TOP GLOW -->

    <radialGradient
        id="glowTop"
        cx="50%"
        cy="50%"
        r="70%">

        <stop
            offset="0%"
            stop-color="#F45C1C"
            stop-opacity="0.16"/>

        <stop
            offset="68%"
            stop-color="#F45C1C"
            stop-opacity="0"/>

    </radialGradient>


    <!-- BOTTOM GLOW -->

    <radialGradient
        id="glowBot"
        cx="50%"
        cy="50%"
        r="70%">

        <stop
            offset="0%"
            stop-color="#F45C1C"
            stop-opacity="0.10"/>

        <stop
            offset="70%"
            stop-color="#F45C1C"
            stop-opacity="0"/>

    </radialGradient>


    <!-- SCANLINE -->

    <linearGradient
        id="scan"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

        <stop
            offset="0%"
            stop-color="#F45C1C"
            stop-opacity="0"/>

        <stop
            offset="45%"
            stop-color="#F45C1C"
            stop-opacity="0.025"/>

        <stop
            offset="50%"
            stop-color="#ffffff"
            stop-opacity="0.04"/>

        <stop
            offset="55%"
            stop-color="#F45C1C"
            stop-opacity="0.025"/>

        <stop
            offset="100%"
            stop-color="#F45C1C"
            stop-opacity="0"/>

    </linearGradient>


    <!-- GRAIN -->

    <filter
        id="grain"
        x="0%"
        y="0%"
        width="100%"
        height="100%">

        <feTurbulence
            type="fractalNoise"
            baseFrequency="0.85"
            numOctaves="4"
            stitchTiles="stitch"/>

    </filter>


    <!-- LOGO GLOW -->

    <filter
        id="logoGlow"
        x="-40%"
        y="-40%"
        width="180%"
        height="180%">

        <feGaussianBlur
            stdDeviation="2.4"
            result="blur"/>

        <feMerge>

            <feMergeNode in="blur"/>

            <feMergeNode in="SourceGraphic"/>

        </feMerge>

    </filter>

</defs>


<!-- ============================================================ -->
<!-- BACKGROUND                                                   -->
<!-- ============================================================ -->

<g clip-path="url(#card)">

    <rect
        width="985"
        height="580"
        fill="#0c1016"/>


    <!-- TOP LIGHT -->

    <ellipse
        cx="492"
        cy="-10"
        rx="420"
        ry="230"
        fill="url(#glowTop)">

        <animate
            attributeName="opacity"
            values="0.55;1;0.55"
            dur="7s"
            repeatCount="indefinite"/>

    </ellipse>


    <!-- BOTTOM LIGHT -->

    <ellipse
        cx="860"
        cy="540"
        rx="260"
        ry="190"
        fill="url(#glowBot)">

        <animate
            attributeName="opacity"
            values="0.4;0.85;0.4"
            dur="9s"
            repeatCount="indefinite"/>

    </ellipse>


    <!-- GRID -->

    <rect
        x="-80"
        y="-80"
        width="1145"
        height="840"
        fill="url(#dots)">

        <animateTransform
            attributeName="transform"
            type="translate"
            from="0 0"
            to="56 56"
            dur="72s"
            repeatCount="indefinite"/>

    </rect>


    <!-- SECOND GRID -->

    <g opacity="0.45">

        <rect
            x="-80"
            y="-80"
            width="1145"
            height="840"
            fill="url(#dots)">

            <animateTransform
                attributeName="transform"
                type="translate"
                from="0 0"
                to="-56 -40"
                dur="96s"
                repeatCount="indefinite"/>

        </rect>

    </g>


    <!-- SCANLINE -->

    <rect
        width="985"
        height="140"
        fill="url(#scan)">

        <animate
            attributeName="y"
            values="-140;580"
            dur="10s"
            repeatCount="indefinite"/>

    </rect>


    <!-- GRAIN -->

    <rect
        width="985"
        height="580"
        filter="url(#grain)"
        opacity="0.04"/>


    <!-- ======================================================== -->
    <!-- ROBLOX STUDIO ASCII                                      -->
    <!-- ======================================================== -->

    <g filter="url(#logoGlow)">

        <text
            x="24"
            y="145"
            class="key ascii"
            xml:space="preserve">

<tspan x="24" y="145">                  .:::::::::::.</tspan>
<tspan x="24" y="156">              .:-=+++++++++++=-:.</tspan>
<tspan x="24" y="167">           .:=+****************+=:.</tspan>
<tspan x="24" y="178">         .-+**********************+-.</tspan>
<tspan x="24" y="189">       .-+**************************+-.</tspan>
